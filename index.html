<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Sentinel · דוח יומי</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root {
  --bg: var(--tg-theme-secondary-bg-color, #f2f3f5);
  --surface: var(--tg-theme-section-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #121418);
  --muted: var(--tg-theme-hint-color, #667085);
  --link: var(--tg-theme-link-color, #2b62d9);
  --accent: var(--tg-theme-button-color, #2b62d9);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --hair: color-mix(in srgb, var(--text) 9%, transparent);
  --wash: color-mix(in srgb, var(--text) 5%, transparent);
  --wash-2: color-mix(in srgb, var(--text) 8%, transparent);

  --up: #0f8a5f;   --up-wash: color-mix(in srgb, var(--up) 13%, transparent);
  --down: #c8372d; --down-wash: color-mix(in srgb, var(--down) 12%, transparent);
  --warn: #b86e00; --warn-wash: color-mix(in srgb, var(--warn) 15%, transparent);
  --info: #2b62d9; --info-wash: color-mix(in srgb, var(--info) 12%, transparent);
  --r1: #0e8aa6; --r2: #c07a0a; --r3: #129466; --r4: #cf3b2f;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --radius: 18px;
  --sans: "IBM Plex Sans Hebrew", -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
/* Outside Telegram: follow the OS. Inside Telegram: follow Telegram's theme (classes below). */
@media (prefers-color-scheme: dark) {
  :root:not(.tg) {
    --bg: #0d0f13; --surface: #161a20; --text: #e9ecf1; --muted: #8d97a6; --link: #79a6ff; --accent: #4c82f5;
    --up: #3ccf91; --down: #ff7a6b; --warn: #f2b14a; --info: #79a6ff;
    --r1: #3fc1dd; --r2: #f0a93a; --r3: #3ccf91; --r4: #ff6b5c; --badge-ink: #10131a;
  }
}
:root.tg-dark {
  --up: #3ccf91; --down: #ff7a6b; --warn: #f2b14a; --info: #79a6ff;
  --r1: #3fc1dd; --r2: #f0a93a; --r3: #3ccf91; --r4: #ff6b5c; --badge-ink: #10131a;
}

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 400 15.5px/1.6 var(--sans);
  font-feature-settings: "tnum" 1;
  padding: 14px 14px calc(32px + env(safe-area-inset-bottom));
  max-width: 680px; margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1 { font-size: 23px; font-weight: 700; line-height: 1.25; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 0; }
h3 { font-size: 16px; font-weight: 600; line-height: 1.35; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); font-weight: 400; }
.num { font-feature-settings: "tnum" 1, "lnum" 1; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
code, .tk { font: 500 12.5px/1 var(--mono); direction: ltr; unicode-bidi: isolate;
  background: var(--wash); padding: 3px 6px; border-radius: 6px; letter-spacing: 0.01em; white-space: nowrap; }
b { font-weight: 600; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 15px; height: 15px; }

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; margin: 0 0 12px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 1px rgba(16, 24, 40, .02); }
.panel > h2 { margin-bottom: 12px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 22px 4px 10px; }
.tap { cursor: pointer; transition: transform 160ms var(--ease-out); }
.tap:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .tap:hover { filter: brightness(1.02); } }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.chev { color: var(--muted); display: inline-flex; }

/* ---------- top bar ---------- */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin: 6px 4px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--text); color: var(--surface);
  display: grid; place-items: center; flex: none; }
.mark .icon { width: 20px; height: 20px; }
.top .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.ago { white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500;
  padding: 5px 10px; border-radius: 999px; background: var(--surface); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--up); box-shadow: 0 0 0 3px var(--up-wash); }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--link); font-weight: 500;
  margin: 2px 2px 6px; cursor: pointer; padding: 4px 0; }
.tg .back { display: none; }

/* ---------- regime ---------- */
.regime-head { display: flex; align-items: center; gap: 10px; }
.badge { font-weight: 700; font-size: 13px; padding: 3px 9px; border-radius: 8px; color: var(--badge-ink, #fff); background: var(--accent); }
.badge.R1 { background: var(--r1); } .badge.R2 { background: var(--r2); }
.badge.R3 { background: var(--r3); } .badge.R4 { background: var(--r4); }
.regime-title { font-size: 21px; font-weight: 700; line-height: 1.3; margin: 10px 0 6px; }
.map { width: 100%; height: auto; display: block; margin: 14px 0 6px; overflow: visible; color: var(--text); direction: ltr; }
.map text { font-family: var(--sans); }
.facts { display: grid; gap: 8px; margin-top: 10px; }
.fact { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.fact .icon { margin-top: 3px; color: var(--muted); }

/* ---------- alerts ---------- */
.alert-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--hair); }
.alert-row:first-of-type { border-top: 0; padding-top: 2px; }
.sev { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; flex: none; }
.sev.critical { background: var(--down-wash); color: var(--down); }
.sev.warning { background: var(--warn-wash); color: var(--warn); }
.sev.info { background: var(--info-wash); color: var(--info); }
.sev.state { background: var(--wash); color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
.pill.critical { background: var(--down-wash); color: var(--down); }
.pill.warning { background: var(--warn-wash); color: var(--warn); }
.pill.info { background: var(--info-wash); color: var(--info); }
.pill.state { background: var(--wash); color: var(--muted); }
.pill.edge { background: var(--wash-2); color: var(--text); font-weight: 500; }
.pill.OW { background: var(--up-wash); color: var(--up); }
.pill.UW { background: var(--down-wash); color: var(--down); }
.pill.Nplus, .pill.Nminus { background: var(--warn-wash); color: var(--warn); }

/* ---------- market tape: one surface, hairline grid ---------- */
.tape { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: var(--radius);
  overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
.cell { padding: 12px 12px 11px; min-width: 0; border-top: 1px solid var(--hair); border-inline-start: 1px solid var(--hair);
  transition: background-color 1200ms var(--ease-out); }
.cell:nth-child(-n+3) { border-top: 0; }
.cell:nth-child(3n+1) { border-inline-start: 0; }
.cell .k { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .v { font-size: 19px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
.cell .c { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 3px; margin-top: 1px; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); }
.flash { background-color: color-mix(in srgb, var(--accent) 14%, transparent); }
.est { color: var(--warn); font-weight: 700; margin-inline-start: 3px; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--wash); font-weight: 500; }
.chip.ow { background: var(--up-wash); color: var(--up); }
.chip.uw { background: var(--down-wash); color: var(--down); }
.group-label { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; margin: 14px 0 8px; }

/* ---------- navigation ---------- */
.nav-item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--hair); }
.nav-item:first-child { border-top: 0; padding-top: 2px; }
.nav-item:last-child { padding-bottom: 2px; }
.nav-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--wash); flex: none; }
.nav-item .t { font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
.step { font-size: 12px; color: var(--muted); font-weight: 500; }
.nav-item .d { font-size: 13px; color: var(--muted); margin-top: 1px; }

/* ---------- detail ---------- */
.note { display: flex; gap: 9px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--hair); font-size: 14.5px; }
.note:first-of-type { border-top: 0; padding-top: 0; }
.note .icon { color: var(--muted); margin-top: 4px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 9px 0; border-top: 1px solid var(--hair); vertical-align: top; font-size: 14.5px; transition: background-color 1200ms var(--ease-out); }
tr:first-child td { border-top: 0; padding-top: 0; }
td.v { text-align: left; white-space: nowrap; font-weight: 600; padding-inline-start: 12px; }
.src { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.ev { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.ev span { font-size: 12.5px; background: var(--wash); padding: 4px 8px; border-radius: 8px; }
.ev span span { background: none; padding: 0; }
.rule .todo { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 14px; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--wash-2); border-radius: 12px; margin: 4px 0 12px; }
.tab { flex: 1; text-align: center; padding: 7px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 500; cursor: pointer;
  color: var(--muted); transition: background-color 200ms var(--ease-out), color 200ms var(--ease-out); }
.tab.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16, 24, 40, .08); }

.alloc-group { padding: 6px 16px; }
.alloc-group > .group-label { margin: 10px 0 2px; }
.item { padding: 13px 0; border-top: 1px solid var(--hair); }
.group-label + .item { border-top: 0; }
.item .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tickers { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.why { font-size: 14.5px; }
.hist { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 13px; margin-top: 8px; }
.verdict { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; }
.verdict.ok { color: var(--up); } .verdict.bad { color: var(--down); }
/* success-rate screen */
.score-big { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 6px 0 2px; }
.score-big.ok { color: var(--up); } .score-big.bad { color: var(--down); }
.rbar { position: relative; height: 8px; background: var(--wash); border-radius: 4px; overflow: hidden; min-width: 70px; }
.rbar i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 4px; background: var(--muted); }
.rbar.ok i { background: var(--up); } .rbar.bad i { background: var(--down); } .rbar.mid i { background: var(--warn); }
.rbar .mid { position: absolute; inset-block: 0; inset-inline-start: 50%; width: 2px; background: var(--text); opacity: .35; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 84px 76px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--hair); }
.srow:first-of-type { border-top: 0; }
.srow .n { text-align: end; font-size: 13px; }
.srow .n small { display: block; color: var(--muted); font-size: 11px; }
.srow .lbl { min-width: 0; } .srow .lbl .meta { display: block; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.duo > div { background: var(--wash); border-radius: 12px; padding: 10px 12px; }
.duo .v { font-size: 22px; font-weight: 700; }
/* v5 expert engine */
.v5-card { border: 1px dashed var(--warn); }
.shadow-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; background: var(--warn-wash); color: var(--warn); }
.zbar { position: relative; height: 8px; background: var(--wash); border-radius: 4px; min-width: 80px; direction: ltr; }
.zbar i { position: absolute; inset-block: 0; border-radius: 4px; background: var(--muted); }
.zbar i.pos { background: var(--down); } .zbar i.neg { background: var(--info); }
.zbar .mid { position: absolute; inset-block: -2px; left: 50%; width: 2px; background: var(--text); opacity: .35; }
.score-pill { display: inline-flex; min-width: 34px; justify-content: center; font-weight: 700; border-radius: 8px; padding: 2px 6px; font-size: 13px; }
.score-pill.p2 { background: var(--up); color: #fff; } .score-pill.p1 { background: var(--up-wash); color: var(--up); }
.score-pill.n1 { background: var(--down-wash); color: var(--down); } .score-pill.n2 { background: var(--down); color: #fff; }
.score-pill.z0 { background: var(--wash); color: var(--muted); }
.grade { display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; border-radius: 6px;
  font-size: 11.5px; font-weight: 700; background: var(--wash); color: var(--muted); }
.vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--hair); }
.vrow:first-of-type { border-top: 0; }
.vrow .meta { display: block; }
.vt { width: 100%; border-collapse: collapse; font-size: 13px; }
.vt th { font-weight: 600; color: var(--muted); font-size: 11.5px; text-align: start; padding: 6px 4px; }
.vt td { padding: 7px 4px; border-top: 1px solid var(--hair); }
.vt td.num, .vt th.num { text-align: end; }
.vt tr.best td { background: var(--up-wash); }
.adj { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--hair); font-size: 14.5px; }
.adj:first-of-type { border-top: 0; padding-top: 0; }
.moves { display: flex; flex-direction: column; gap: 4px; flex: none; }
.mv { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; font-size: 13px; }
.list { margin: 0; padding-inline-start: 20px; } .list li { margin-bottom: 8px; } .list li::marker { color: var(--muted); }
.drow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--hair); font-size: 14.5px; }
.panel > h2 + .drow { border-top: 0; padding-top: 0; }
.dval { text-align: left; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.dval .v { font-weight: 600; transition: background-color 1200ms var(--ease-out); }
.st { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.st.ok { background: var(--up-wash); color: var(--up); }
.st.info { background: var(--info-wash); color: var(--info); }
.st.warn { background: var(--warn-wash); color: var(--warn); }
.st.mute { background: var(--wash); color: var(--muted); }
.st.bad { background: var(--down-wash); color: var(--down); }
.bad-txt { color: var(--down); }
/* explain-on-tap affordance + bottom sheet (Emil: drawer curve, origin bottom, interruptible transition) */
.x { cursor: help; text-decoration: underline dotted color-mix(in srgb, var(--muted) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.xi { color: var(--muted); display: inline-flex; vertical-align: -2px; margin-inline-start: 3px; }
.backdrop { position: fixed; inset: 0; background: rgba(8, 10, 14, .42); opacity: 0; pointer-events: none;
  transition: opacity 260ms var(--ease-out); z-index: 20; }
.backdrop.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; inset-inline: 0; bottom: 0; margin: 0 auto; max-width: 680px; max-height: 84vh; overflow-y: auto;
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform 320ms cubic-bezier(0.32, 0.72, 0, 1); z-index: 21;
  box-shadow: 0 -8px 30px rgba(16, 24, 40, .18); overscroll-behavior: contain; }
.sheet.on { transform: translateY(0); }
.grab { width: 38px; height: 5px; border-radius: 99px; background: var(--wash-2); margin: 2px auto 12px; }
.sheet h2 { font-size: 20px; margin-bottom: 6px; }
.sheet .big { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 6px 0 2px; }
.sheet .why { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--wash); font-size: 14.5px; }
.sheet .close { position: absolute; top: 10px; inset-inline-end: 12px; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--wash); color: var(--muted); cursor: pointer; border: 0; }
.chart-box { height: 380px; margin: 10px -6px 4px; border-radius: 12px; overflow: hidden; }
.heat { height: 430px; margin: 8px -8px -6px; border-radius: 12px; overflow: hidden; }
.heat-ph { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.tk[data-chart] { cursor: pointer; transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out); }
.tk[data-chart]:active { transform: scale(0.95); }
@media (hover: hover) and (pointer: fine) { .tk[data-chart]:hover { background: var(--wash-2); } }
@media (prefers-reduced-motion: reduce) { .sheet, .backdrop { transition: none; } }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; line-height: 1.7; }
.err { text-align: center; padding: 36px 16px; }
.sk { height: 120px; border-radius: var(--radius); background: var(--surface); margin-bottom: 12px; opacity: .6; }

@media (prefers-reduced-motion: reduce) {
  .tap, .cell, .tab, td { transition: none; }
  .tap:active { transform: none; }
}
</style>
</head>

<div id="app"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined
  ? window.Telegram.WebApp : null;
function applyTgTheme() {
  document.documentElement.classList.remove("tg-dark", "tg-light");
  document.documentElement.classList.add(tg.colorScheme === "dark" ? "tg-dark" : "tg-light");
}
if (tg && tg.platform && tg.platform !== "unknown") {
  document.documentElement.classList.add("tg");
  applyTgTheme();
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
  tg.onEvent("themeChanged", applyTgTheme);
}
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let R = null;           // current report
let PREV = null;        // previous report, kept for one render to highlight changed values
let allocFilter = "all";
let lastRoute = null;

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Texts from rules.yaml may carry <b>, <i>, <code>; allow exactly those.
function html(s) {
  const decoded = String(s ?? "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&");
  return esc(decoded).replace(/&lt;(\/?)(b|i|code)&gt;/g, "<$1$2>");
}
const icon = (name, cls = "") => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
function fmt(v, unit, signed) {
  if (v === null || v === undefined) return "—";
  const a = Math.abs(v);
  const s = a >= 1000 ? Math.round(a).toLocaleString("en-US") : a.toFixed(2);
  const sign = v < 0 ? "−" : (signed && v > 0 ? "+" : "");
  if (unit === "$") return `${sign}$${s}`;
  if (unit === "T") return `${sign}$${s}T`;
  const suf = { "%": "%", bp: "bp", pp: "pp", K: "K" }[unit] || "";
  return `${sign}${s}${suf}`;
}
const num = (v, unit, signed) => `<span class="num">${esc(fmt(v, unit, signed))}</span>`;
const OPS_HE = { ">": "מעל ", "<": "מתחת ל-", ">=": "לפחות ", "<=": "עד ", "==": "שווה ל-" };
const SEV = { critical: "קריטי", warning: "אזהרה", info: "מעקב" };
const SEV_ICON = { critical: "alert", warning: "alert", info: "info" };
const STANCE = { OW: "משקל יתר", "N+": "סלקטיבי", "N-": "ניטרלי-שלילי", UW: "משקל חסר" };
const stanceCls = (s) => (s === "N+" ? "Nplus" : s === "N-" ? "Nminus" : s);
const cleanLabel = (l) => String(l || "").replace(/\s*\(.*?\)/g, "").replace(/^פרוקסי\s+/, "");
function haptic() { try { tg && tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
const sig = (name) => (R.signals || {})[name] || {};

/* ---------- routing ---------- */
const ORDER = ["", "market", "regime", "alloc", "score", "v5", "exec", "news", "data"];
const ROUTES = { "": home, market, regime, alloc, score, v5, exec, news, data };
function go(route) { haptic(); location.hash = route ? "#/" + route : "#/"; }
const currentRoute = () => (location.hash.replace(/^#\/?/, "") || "").split("?")[0];
function render(keepScroll) {
  const route = currentRoute();
  const view = ROUTES[route] || home;
  const y = window.scrollY;
  const app = $("#app");
  app.innerHTML = view();
  window.scrollTo(0, keepScroll ? y : 0);
  if (tg) { route ? tg.BackButton.show() : tg.BackButton.hide(); }
  bind();
  // The one authored motion: screens slide in the reading direction (RTL: deeper comes from the left).
  if (lastRoute !== null && lastRoute !== route && app.animate) {
    const forward = ORDER.indexOf(route) > ORDER.indexOf(lastRoute);
    const dx = REDUCED ? 0 : (forward ? -14 : 14);
    app.animate(
      [{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: "translateX(0)" }],
      { duration: 220, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
  }
  lastRoute = route;
  flashChanged();
  if (!route) mountHeatmap();
}
function bind() {
  document.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => go(el.dataset.go)));
  document.querySelectorAll("[data-tab]").forEach((el) => el.addEventListener("click", () => {
    allocFilter = el.dataset.tab; haptic(); render(true);
  }));
  const b = $(".back"); if (b) b.addEventListener("click", () => history.back());
}
if (tg) tg.BackButton.onClick(() => (sheetOpen ? closeSheet() : history.back()));
document.addEventListener("DOMContentLoaded", () => {});
window.addEventListener("load", () => {
  $("#backdrop").addEventListener("click", closeSheet);
  $("#sheet-close").addEventListener("click", closeSheet);
});
window.addEventListener("hashchange", () => { if (sheetOpen) closeSheet(); render(false); });

// After an auto-refresh, briefly tint the values that actually changed: state, not decoration.
function flashChanged() {
  if (!PREV) return;
  const before = PREV.signals || {}, after = R.signals || {};
  document.querySelectorAll("[data-sig]").forEach((el) => {
    const a = before[el.dataset.sig], b = after[el.dataset.sig];
    if (a && b && a.value !== b.value) {
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1400);
    }
  });
  PREV = null;
}

/* ---------- explain-on-tap, charts, heatmap ---------- */
// theme is read from the colour actually painted, so embedded charts always match the page
function surfaceRGB() {
  const probe = $("#sheet") || document.body;
  const m = getComputedStyle(probe).backgroundColor.match(/\d+(\.\d+)?/g) || [255, 255, 255];
  return m.slice(0, 3).map(Number);
}
const isDark = () => { const [r, g, b] = surfaceRGB(); return 0.2126 * r + 0.7152 * g + 0.0722 * b < 128; };
let sheetOpen = false;
function openSheet(html) {
  $("#sheet-body").innerHTML = html;
  $("#sheet").scrollTop = 0;
  $("#backdrop").classList.add("on"); $("#sheet").classList.add("on");
  sheetOpen = true; haptic();
  if (tg) tg.BackButton.show();
}
function closeSheet() {
  $("#backdrop").classList.remove("on"); $("#sheet").classList.remove("on");
  sheetOpen = false;
  if (tg && !currentRoute()) tg.BackButton.hide();
  setTimeout(() => { if (!sheetOpen) $("#sheet-body").innerHTML = ""; }, 340);   // drop heavy widgets after exit
}
const G = () => (R && R.glossary) || { concepts: {}, signals: {} };
// the unit a signal is shown with elsewhere in the app (KPI tiles / market tables)
function unitOf(id) {
  const k = (R.kpis || []).find((x) => x.signal === id);
  if (k) return k.unit;
  for (const g of R.market_groups || []) { const it = g.items.find((x) => x.signal === id); if (it) return it.unit; }
  return "";
}
function explain(ref) {
  const [kind, id] = ref.split(":");
  let concept, sigHtml = "";
  if (kind === "sig") {
    concept = G().concepts[G().signals[id]];
    const s = sig(id);
    if (s && s.label) {
      const [stHe, cls, ic] = STATUS[s.status] || STATUS.unverified;
      sigHtml = `<div class="big num">${s.status === "missing" ? "—" : esc(fmt(s.value, unitOf(id), s.signed))}</div>
        <div class="meta">${esc(s.label)}${s.date ? ` · נכון ל-<span class="num">${esc(s.date)}</span>` : ""} · ${esc(s.publisher || s.source)}</div>
        <div class="chips" style="margin-top:8px"><span class="st ${cls}" data-x="t:${s.status === "validated" ? "validated" : s.status === "official" ? "official" : s.status === "commercial" ? "commercial" : s.status === "estimate" ? "estimate" : "unverified"}">${icon(ic, "sm")}${stHe}</span></div>`;
    }
  } else {
    concept = G().concepts[id];
  }
  if (!concept) return;
  openSheet(`<h2 id="sheet-title">${esc(concept.title)}</h2>${sigHtml}
    <p style="margin-top:10px">${esc(concept.text)}</p>
    ${concept.why ? `<div class="why"><b>למה זה חשוב:</b> ${esc(concept.why)}</div>` : ""}`);
}
// TradingView symbols for the non-ETF items in the matrix
// every ticker the app can show, pinned to its US listing (a bare ticker can resolve to a foreign namesake)
const TV = {
  DXY: "TVC:DXY", US10Y: "TVC:US10Y", BTC: "BITSTAMP:BTCUSD", ETH: "BITSTAMP:ETHUSD",
  ...Object.fromEntries("ARKG ARKQ COWZ HUMN IGV ITA ITB IYT MAGS PAVE".split(" ").map((t) => [t, "CBOE:" + t])),
  ...Object.fromEntries("BLOK COPX DIA FITE GDX HAIL IHE IHI IWM JETS KIE KRE LIT MSOS NASA NLR OIH PEJ POWR PPA ROBO ROKT SPY TAN URA URNM VNQ XAR XBI XHB XLB XLC XLE XLF XLI XLK XLP XLRE XLU XLV XLY XME XOP XRT".split(" ").map((t) => [t, "AMEX:" + t])),
  ...Object.fromEntries("BOTZ BUG CHPX CIBR CLOU DRIV FINX GRID IBB ICLN KBWB KOID OZEM QCLN QQQ RING SKYY SMH SOCL SOXX UFO WCLD".split(" ").map((t) => [t, "NASDAQ:" + t])),
};
// listed in the matrix but no longer trading in the US: never chart a foreign fund with the same ticker
const NO_CHART = new Set(["BTEC", "BTEK"]);
function tvWidget(type, config, height) {
  const box = document.createElement("div");
  box.className = "tradingview-widget-container";
  box.style.height = height;
  box.innerHTML = '<div class="tradingview-widget-container__widget" style="height:100%"></div>';
  const sc = document.createElement("script");
  sc.async = true;
  sc.src = `https://s3.tradingview.com/external-embedding/embed-widget-${type}.js`;
  sc.textContent = JSON.stringify(config);
  box.appendChild(sc);

}
function openChart(ticker, label) {
  if (ticker === "Cash") return explain("t:stance");
  lastChart = [ticker, label];
  if (NO_CHART.has(ticker) || !TV[ticker]) {
    return openSheet(`<h2 id="sheet-title"><span class="num">${esc(ticker)}</span></h2><div class="meta">${esc(label || "")}</div>
      <p class="why">אין גרף אמין לטיקר הזה: נראה שתעודת הסל כבר לא נסחרת בארה״ב, ובבורסות אחרות יש קרן אחרת עם אותו שם. מוצג במסגרת לצורך שלמות בלבד.</p>`);
  }
  openSheet(`<h2 id="sheet-title"><span class="num">${esc(ticker)}</span></h2><div class="meta">${esc(label || "")}</div>
    <div class="chart-box" id="chart-box"></div>
    <p class="meta">קו = מחיר סגירה יומי · קו נוסף = ממוצע נע 150 ימים (מחיר מעליו = מגמה עולה). גרף: TradingView, ייתכנו עיכובים במחירים.</p>
    <div class="why" data-x="t:etf"><b>מה זה ${esc(ticker)}?</b> לחיצה כאן מסבירה מה זו תעודת סל.</div>`);
  const [r, g, b] = surfaceRGB(), dark = isDark();
  $("#chart-box").appendChild(tvWidget("advanced-chart", {
    symbol: TV[ticker] || ticker, interval: "D", range: "12M", style: "2", // daily closes drawn as a line
    theme: dark ? "dark" : "light", locale: "he_IL", timezone: "America/New_York", autosize: true,
    backgroundColor: `rgb(${r},${g},${b})`, gridColor: dark ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)",
    hide_top_toolbar: true, hide_side_toolbar: true, allow_symbol_change: false, save_image: false,
    calendar: false, hide_volume: true, withdateranges: true, support_host: "https://www.tradingview.com",
    studies: [{ id: "MASimple@tv-basicstudies", inputs: { length: 150 } }],
  }, "100%"));
}
function mountHeatmap() {
  const host = $("#heat");
  if (!host) return;
  const load = () => {
    host.innerHTML = "";
    host.appendChild(tvWidget("stock-heatmap", {
      exchanges: [], dataSource: "SPX500", grouping: "sector", blockSize: "market_cap_basic", blockColor: "change",
      locale: "he_IL", symbolUrl: "", colorTheme: isDark() ? "dark" : "light", hasTopBar: false,
      isDataSetEnabled: false, isZoomEnabled: true, hasSymbolTooltip: true, isMonoSize: false,
      width: "100%", height: "100%",
    }, "100%"));
  };
  // load only when it scrolls into view: keeps the first paint fast
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); load(); } }, { rootMargin: "200px" });
    io.observe(host);
  } else load();
}
// one delegated, capture-phase handler: a term inside a tappable card explains instead of navigating
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-chart]");
  const x = e.target.closest("[data-x]");
  if (!c && !x) return;
  e.stopPropagation(); e.preventDefault();
  if (c) openChart(c.dataset.chart, c.dataset.label); else explain(x.dataset.x);
}, true);
document.addEventListener("click", (e) => {
  const p = e.target.closest("[data-v5p]");
  if (p && !e.target.closest("[data-x],[data-chart]")) v5Pillar(p.dataset.v5p);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetOpen) closeSheet(); });
let lastChart = null;
function retheme() {
  const h = $("#heat");
  if (h && h.childElementCount) { h.innerHTML = ""; mountHeatmap(); }
  if (sheetOpen && lastChart) openChart(...lastChart);
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => setTimeout(retheme, 50));
if (tg && tg.onEvent) tg.onEvent("themeChanged", () => setTimeout(retheme, 50));

/* ---------- shared pieces ---------- */
const PHASE = { pre: ["טרום מסחר", "live"], open: ["מסחר פתוח", "live"], post: ["אחרי סגירה", ""], closed: ["שוק סגור", ""] };
const SLOT = { morning: "דוח בוקר", premarket: "עדכון טרום מסחר", postclose: "עדכון אחרי סגירה", manual: "עדכון" };
function ago(iso) {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return "עכשיו";
  if (min < 60) return `לפני ${min} דק׳`;
  const h = Math.round(min / 60);
  return h < 24 ? `לפני ${h} שע׳` : `לפני ${Math.round(h / 24)} ימים`;
}
function header(title, isHome) {
  const m = R.meta;
  const [phaseHe, cls] = PHASE[m.market_phase] || (m.market_open ? PHASE.open : PHASE.closed);
  const when = new Date(m.generated_at).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
  const back = isHome ? "" : `<div class="back" role="button" tabindex="0">${icon("back", "sm")}לסיכום</div>`;
  return `${back}<div class="top"><div class="brand">${isHome ? `<div class="mark">${icon("mark")}</div>` : ""}<div>
      <h1>${title}</h1>
      <div class="sub">${esc(SLOT[m.slot] || "עדכון")} · <span class="num">${esc(when)}</span> · <span class="ago">${esc(ago(m.generated_at))}</span></div></div></div>
    <span class="status"><span class="dot ${cls}"></span>${phaseHe} · <span class="num">${esc(m.ny_time.split(" ")[1])} ET</span></span></div>`;
}

// The ECB threshold matrix, drawn: x = output gap (≈ CBO), y = core PCE. Four regimes, one dot.
function regimeMap(g, large) {
  const pce = g.inputs.find((i) => i.signal === "pce_yoy");
  const gap = g.inputs.find((i) => i.signal === "output_gap_proxy");
  if (!pce || !gap) return "";
  const W = 320, H = large ? 200 : 170, L = 46, Rr = 8, T = 8, B = 28;
  const xMin = -2, xMax = 2, yMin = 0, yMax = 5;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const X = (v) => L + (clamp(v, xMin, xMax) - xMin) / (xMax - xMin) * (W - L - Rr);
  const Y = (v) => T + (1 - (clamp(v, yMin, yMax) - yMin) / (yMax - yMin)) * (H - T - B);
  const x0 = X(0), y2 = Y(2), px = X(gap.value), py = Y(pce.value);
  const col = (c) => `var(--${c.toLowerCase()})`;
  const quads = [
    ["R2", L, T, x0 - L, y2 - T, "רפיון אינפלציוני"], ["R4", x0, T, W - Rr - x0, y2 - T, "גאות אינפלציונית"],
    ["R1", L, y2, x0 - L, H - B - y2, "התאוששות"], ["R3", x0, y2, W - Rr - x0, H - B - y2, "צמיחה בלי אינפלציה"],
  ].map(([c, x, y, w, h, he]) => {
    const on = c === g.code;
    const tx = x + w / 2, ty = y + h / 2;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col(c)}" fill-opacity="${on ? 0.15 : 0.035}"/>
      <text x="${tx}" y="${ty - 2}" text-anchor="middle" font-size="12" font-weight="700" fill="${col(c)}" fill-opacity="${on ? 1 : 0.6}">${c}</text>
      <text x="${tx}" y="${ty + 13}" text-anchor="middle" font-size="10.5" fill="currentColor" fill-opacity="${on ? 0.8 : 0.45}" direction="rtl" unicode-bidi="embed">${he}</text>`;
  }).join("");
  const ticksY = [0, 2, 5].map((v) => `<text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".5">${v}%</text>`).join("");
  const ticksX = [-2, 0, 2].map((v) => `<text x="${X(v)}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".5">${v > 0 ? "+" : ""}${v}</text>`).join("");
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" dir="ltr"
      aria-label="מפת רג'ימים: אינפלציית ליבה ${pce.value.toFixed(2)} אחוז, פער תוצר ${gap.value.toFixed(2)}">
    ${quads}
    <rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}" rx="2" fill="none" stroke="currentColor" stroke-opacity=".14"/>
    <line x1="${x0}" y1="${T}" x2="${x0}" y2="${H - B}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/>
    <line x1="${L}" y1="${y2}" x2="${W - Rr}" y2="${y2}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/>
    ${ticksY}${ticksX}
    <text x="${(L + W - Rr) / 2}" y="${H - 1}" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".55" direction="rtl" unicode-bidi="embed">פער תוצר (≈ הערכת CBO)</text>
    <text transform="translate(9 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".55" direction="rtl" unicode-bidi="embed">אינפלציית ליבה</text>
    <line x1="${px}" y1="${py}" x2="${x0}" y2="${py}" stroke="${col(g.code)}" stroke-width="1.5" stroke-opacity=".6"/>
    <circle cx="${px}" cy="${py}" r="10" fill="${col(g.code)}" fill-opacity=".18"/>
    <circle cx="${px}" cy="${py}" r="4.5" fill="${col(g.code)}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

/* ---------- views ---------- */
function home() {
  const g = R.regime, s = R.summary;

  let regimePanel = `<div class="panel"><h2>מצב הכלכלה</h2><p class="muted" style="margin-top:6px">לא נקבע — חסרים נתונים: ${esc((R.regime_missing || []).join(", "))}</p></div>`;
  if (g) {
    const sahm = sig("sahm_level").value;
    regimePanel = `<div class="panel tap" data-go="regime" role="button" tabindex="0">
      <div class="row between"><div class="regime-head"><span class="badge ${esc(g.code)}" data-x="t:${esc(g.code)}">${esc(g.code)}</span><span class="meta x" data-x="t:regime">מצב הכלכלה</span></div><span class="chev">${icon("chev")}</span></div>
      <div class="regime-title"><span class="x" data-x="t:${esc(g.code)}">${esc(g.short_he)}</span></div>
      <p>${esc(g.summary_he)}</p>
      ${regimeMap(g, false)}
      <div class="facts">
        <div class="fact" data-x="t:fragility">${icon("gauge", "sm")}<span class="x">${html(s.fragility)}</span></div>
        ${sahm !== undefined ? `<div class="fact" data-x="sig:sahm_level">${icon("flask", "sm")}<span class="x">בדיקה נמדדת: כלל סאם ${num(sahm, "", false)}, סף מיתון <span class="num">0.50</span></span></div>` : ""}
      </div></div>`;
  }

  const alertRows = R.alerts.length
    ? R.alerts.map((a) => `<div class="alert-row"><span class="sev ${a.severity}">${icon(SEV_ICON[a.severity])}</span>
        <div class="grow"><b>${esc(a.short_he)}</b></div>${a.edge ? `<span class="pill edge">על הסף</span>` : ""}<span class="pill ${a.severity}" data-x="t:alert">${SEV[a.severity]}</span></div>`).join("")
    : `<div class="alert-row"><span class="sev info">${icon("check")}</span><div class="grow">אין התראות פעילות</div></div>`;
  const stateRows = R.states.map((a) => `<div class="alert-row"><span class="sev state">${icon("repeat")}</span>
      <div class="grow">${esc(a.short_he)}</div><span class="pill state" data-x="t:state">מצב מתמשך</span></div>`).join("");

  const tape = R.kpis.map((k) => {
    let c = "";
    if (k.change_value !== null && k.change_value !== undefined) {
      const dir = k.change_value > 0 ? "up" : k.change_value < 0 ? "down" : "flat";
      c = `<div class="c"><span class="${dir}">${icon(dir, "sm")}</span>${num(k.change_value, k.change_unit, true)}<span>${esc(k.change_label || "")}</span></div>`;
    } else if (k.note_he) c = `<div class="c">${esc(k.note_he)}</div>`;
    return `<div class="cell" data-sig="${esc(k.signal)}" data-x="sig:${esc(k.signal)}" role="button" tabindex="0"><div class="k x">${esc(k.label_he)}${k.estimate ? '<span class="est">≈</span>' : ""}</div><div class="v">${num(k.value, k.unit, k.signed)}</div>${c}</div>`;
  }).join("");

  const split = (txt) => (txt && txt !== "—" ? txt.split(", ") : []);
  const ow = R.allocation.items.filter((i) => i.stance === "OW").length;
  const uw = R.allocation.items.filter((i) => i.stance === "UW").length;
  const okCount = R.data_quality.validation.filter((v) => v.ok).length;
  const nav = [
    ["market", "market", "שוק", "1", `${R.market_notes.length} תצפיות · ${R.market_groups.reduce((n, gg) => n + gg.items.length, 0)} נתונים`],
    ["regime", "compass", "רג'ים ואנומליות", "2", `${g ? g.code : "—"} · ${R.alerts.length} התראות · ${R.states.length} מצבים`],
    ["alloc", "layers", "הקצאה ונימוקים", "3", `${ow} להגדיל · ${uw} להקטין · ${R.allocation.adjustments.length} התאמות`],
    ["score", "gauge", "סיכויי הצלחה", "", scoreNavLine()],
    ["v5", "flask", "מנוע מומחה v5 (בבדיקה)", "", v5NavLine()],
    ["exec", "target", "ביצוע וסיכון", "4", `${R.execution.actions.length} פעולות · סגנון וסינון מניות`],
    ["news", "news", "כותרות", "", R.news.items.length ? `${R.news.items.length} כותרות` : "אין כותרות עדכניות"],
    ["data", "shield", "איכות ומקורות", "", (() => { const v = Object.values(R.signals); const n = (st) => v.filter((x) => x.status === st).length;
        return `${v.length} נתונים · ${n("official")} רשמי · ${n("validated")} אומת · ${n("unverified")} לא אומת` + (n("missing") + n("failed") ? ` · ${n("missing") + n("failed")} נכשלו` : ""); })()],
  ].map(([r, ic, t, step, d]) => `<div class="nav-item tap" data-go="${r}" role="button" tabindex="0"><span class="nav-ic">${icon(ic)}</span>
      <div class="grow"><div class="t">${step ? `<span class="step">שלב ${step}</span>` : ""}${t}</div><div class="d">${esc(d)}</div></div><span class="chev">${icon("chev")}</span></div>`).join("");

  const V = R.v5;
  const v5Card = `<div class="panel tap v5-card" data-go="v5" role="button" tabindex="0" aria-label="מעבר למנוע מומחה v5">
    <div class="row between"><div class="row" style="gap:10px"><span class="nav-ic">${icon("flask")}</span>
      <div><div class="t"><b>מנוע מומחה v5</b> <span class="shadow-badge">בבדיקה</span></div>
      <div class="meta">${V && !V.error ? `${esc(V.regime.code || "—")} · ${esc(V.regime.sub_state || "")} · ביטחון <span class="num">${V.confidence.total ?? "—"}</span>${R.regime && V.regime.code === R.regime.code ? " · מסכים עם המנוע הקיים" : R.regime ? " · <b>לא מסכים</b> עם המנוע הקיים" : ""}` : "עמודי תווך, שכבות סיכון, ציון ביטחון ומטריצת סקטורים"}</div></div></div>
      <span class="chev">${icon("chev")}</span></div></div>`;
  return header("דוח מאקרו", true) + regimePanel + v5Card +
    `<div class="panel tap" data-go="regime" role="button" tabindex="0"><div class="row between" style="margin-bottom:10px"><h2>התראות</h2><span class="chev">${icon("chev")}</span></div>${alertRows}${stateRows}</div>
     <div class="tape">${tape}</div>
     <div class="panel tap" data-go="alloc" role="button" tabindex="0"><div class="row between"><h2>מה עושים</h2><span class="chev">${icon("chev")}</span></div>
       <div class="group-label up" style="margin-top:12px">${icon("up", "sm")}להגדיל</div><div class="chips">${split(s.overweight).map((l) => `<span class="chip ow">${esc(l)}</span>`).join("") || "—"}</div>
       <div class="group-label down">${icon("down", "sm")}להקטין</div><div class="chips">${split(s.underweight).map((l) => `<span class="chip uw">${esc(l)}</span>`).join("") || "—"}</div></div>
     <div class="panel"><div class="row between"><h2>מפת החום של השוק</h2><span class="xi" data-x="t:etf">${icon("q", "sm")}</span></div>
       <p class="meta" style="margin-top:2px">S&amp;P 500 לפי סקטורים · גודל = שווי שוק · צבע = שינוי יומי · לחיצה על סקטור מגדילה אותו</p>
       <div class="heat" id="heat"><div class="heat-ph">טוען מפת חום…</div></div></div>
     <div class="panel">${nav}</div>
     <p class="meta" style="text-align:center;margin:-2px 0 0">טיפ: לחיצה על מונח עם קו מקווקו או על טיקר מציגה הסבר או גרף</p>
     <div class="foot"><bdi dir="ltr">Macro Sentinel v${esc(R.meta.version)}</bdi><br>≈ הערכה או מודל · פלט של מסגרת ניתוח, לא ייעוץ השקעות</div>`;
}

function market() {
  const notes = R.market_notes.map((n) => `<div class="note">${icon("dot", "sm")}<span>${html(n)}</span></div>`).join("")
    || `<p class="muted">אין תנועה חריגה בשוק.</p>`;
  const groups = R.market_groups.map((gg) => `<div class="panel"><h2>${esc(gg.title_he)}</h2><table>${gg.items.map((it) => {
    const s = sig(it.signal);
    return `<tr data-x="sig:${esc(it.signal)}"><td><span class="x">${esc(it.label)}</span>${it.estimate ? '<span class="est">≈</span>' : ""}<span class="src">${esc(s.source || "")}${s.date ? " · " + esc(s.date) : ""}</span></td><td class="v" data-sig="${esc(it.signal)}">${num(it.value, it.unit, it.signed)}</td></tr>`;
  }).join("")}</table></div>`).join("");
  return header("שוק") + `<div class="panel"><h2>מה בולט היום</h2>${notes}</div>` + groups;
}

function evidence(list) {
  return `<div class="ev">${list.map((e) => `<span data-x="sig:${esc(e.signal)}" class="x">${esc(cleanLabel(e.label))}: <b class="num">${esc(fmt(e.value, "", false))}</b> · סף: ${OPS_HE[e.op] || ""}<span class="num">${esc(e.threshold)}</span></span>`).join("")}</div>`;
}
function ruleBlock(a) {
  const isState = a.kind === "state";
  return `<div class="panel rule">
    <div class="row"><span class="sev ${isState ? "state" : a.severity}">${icon(isState ? "repeat" : SEV_ICON[a.severity])}</span>
      <h3 class="grow">${esc(a.short_he)}</h3>${a.edge ? `<span class="pill edge">על הסף</span>` : ""}<span class="pill ${isState ? "state" : a.severity}" data-x="t:${isState ? "state" : "alert"}">${isState ? "מצב מתמשך" : SEV[a.severity]}</span></div>
    ${evidence(a.evidence)}<p>${html(a.synthesis_he)}</p>
    ${a.risk_he ? `<div class="todo"><b>מה לעשות:</b> ${html(a.risk_he)}</div>` : ""}</div>`;
}
function regime() {
  const g = R.regime;
  let top = `<div class="panel"><p>רג'ים לא נקבע.</p></div>`;
  if (g) {
    top = `<div class="panel"><div class="regime-head"><span class="badge ${esc(g.code)}" data-x="t:${esc(g.code)}">${esc(g.code)}</span><h2 class="x" data-x="t:${esc(g.code)}">${esc(g.short_he)}</h2></div>
      ${regimeMap(g, true)}
      <p>${html(g.synthesis_he)}</p>
      <table style="margin-top:12px">${g.inputs.map((i) => `<tr data-x="sig:${esc(i.signal)}"><td><span class="x">${esc(cleanLabel(i.label))}</span>${i.signal === "output_gap_proxy" ? '<span class="est">≈</span>' : ""}<span class="src">סף: ${OPS_HE[i.op] || ""}<span class="num">${esc(i.threshold)}</span></span></td><td class="v" data-sig="${esc(i.signal)}">${num(i.value, "", true)}</td></tr>`).join("")}</table>
      <div class="facts"><div class="fact">${icon("gauge", "sm")}<span>${html(R.summary.fragility)}</span></div></div></div>`;
  }
  const alerts = R.alerts.length ? R.alerts.map(ruleBlock).join("")
    : `<div class="panel"><div class="row"><span class="sev info">${icon("check")}</span><span>אין התראות פעילות.</span></div></div>`;
  const states = R.states.map(ruleBlock).join("");
  return header("רג'ים ואנומליות") + top +
    `<div class="section-title"><h2>התראות</h2><span class="meta">${R.alerts.length}</span></div>${alerts}` +
    (states ? `<div class="section-title"><h2>מצבים מתמשכים</h2><span class="meta">${R.states.length}</span></div>
      <p class="meta" style="margin:-4px 4px 10px">תנאים שנמשכים שבועות או חודשים. מוצגים, אבל לא נשלחים כהתראה.</p>${states}` : "");
}

function alloc() {
  const code = R.regime ? R.regime.code : "";
  const tabs = [["all", "הכל"], ["OW", "להגדיל"], ["N+", "סלקטיבי"], ["UW", "להקטין"]]
    .map(([k, l]) => `<div class="tab ${allocFilter === k ? "on" : ""}" data-tab="${k}" role="tab" aria-selected="${allocFilter === k}" tabindex="0">${l}</div>`).join("");
  const itemHtml = (i) => {
    const hist = i.history === null ? "" :
      `<div class="hist" data-x="t:history"><span class="muted x">היסטוריה ב-${esc(code)}:</span><b>${num(i.history, "%", true)}</b><span class="muted">לחודש מול</span><span class="num muted">S&amp;P 500</span>
        <span class="verdict ${i.agrees ? "ok" : "bad"}">${icon(i.agrees ? "check" : "x", "sm")}${i.agrees ? "תמכה" : "לא תמכה"}</span>
        <span class="meta">· לפי <span class="num">${esc(i.history_ticker)}</span></span></div>`;
    return `<div class="item"><div class="head"><h3>${esc(i.label)}</h3><span class="pill ${stanceCls(i.stance)}" data-x="t:stance">${STANCE[i.stance]}</span></div>
      <div class="tickers">${i.all_tickers.map((t) => `<span class="tk" data-chart="${esc(t)}" data-label="${esc(i.label)}" role="button" tabindex="0">${esc(t)}</span>`).join("")}</div>
      <p class="why">${esc(i.why)}</p>${hist}${itemScore(i)}</div>`;
  };
  const groups = [["OW", "להגדיל", "up"], ["N+", "סלקטיבי", "dot"], ["N-", "ניטרלי-שלילי", "dot"], ["UW", "להקטין", "down"]]
    .filter(([st]) => allocFilter === "all" || allocFilter === st)
    .map(([st, he, ic]) => {
      const items = R.allocation.items.filter((i) => i.stance === st);
      if (!items.length) return "";
      const cls = st === "OW" ? "up" : st === "UW" ? "down" : "";
      return `<div class="panel alloc-group"><div class="group-label ${cls}">${icon(ic, "sm")}${he}<span class="meta">${items.length}</span></div>${items.map(itemHtml).join("")}</div>`;
    }).join("");
  const neutral = R.allocation.neutral.length && allocFilter === "all"
    ? `<div class="panel"><div class="group-label" style="margin-top:0">${icon("flat", "sm")}ניטרלי</div><div class="chips">${R.allocation.neutral.map((n) => `<span class="chip">${esc(n.label)}</span>`).join("")}</div></div>` : "";
  const adj = R.allocation.adjustments.map((a) => `<div class="adj"><div class="moves">
      ${a.overweight.length ? `<span class="mv up">${icon("up", "sm")}${a.overweight.map((t) => `<span class="tk" data-chart="${esc(t)}">${esc(t)}</span>`).join("")}</span>` : ""}
      ${a.underweight.length ? `<span class="mv down">${icon("down", "sm")}${a.underweight.map((t) => `<span class="tk" data-chart="${esc(t)}">${esc(t)}</span>`).join("")}</span>` : ""}
    </div><div class="grow">${html(a.text_he)}</div></div>`).join("");
  return header("הקצאה ונימוקים") +
    `<p class="meta" style="margin:0 4px 8px">היסטוריה: תשואה עודפת ממוצעת לחודש מול <span class="num">S&amp;P 500</span> בימי הרג'ים הנוכחי, <span class="num">2016–2026</span>, לפי תעודת סל מייצגת.</p>
     <div class="tabs" role="tablist">${tabs}</div>${groups || `<div class="panel"><p class="muted">אין פריטים בסינון הזה.</p></div>`}${neutral}
     ${adj && allocFilter === "all" ? `<div class="panel"><h2><span class="x" data-x="t:adjustment">התאמות פעילות</span> <span class="meta">${R.allocation.adjustments.length}</span></h2>
       <p class="meta" style="margin:-6px 0 10px">חוקי "אם-אז" שמגיבים לרמות השוק עכשיו, מעל ההקצאה הבסיסית.</p>${adj}</div>` : ""}`;
}

/* ---------- success rate ---------- */
const pct1 = (v) => (v === null || v === undefined ? "—" : `${v.toFixed(1)}%`);
const ym = (s) => (s ? `${s.slice(5, 7)}/${s.slice(0, 4)}` : "");
const dmy = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "");
// green only when the whole 95% range is above a coin flip; red when it is all below
const rateCls = (b) => (!b || !b.n ? "mute" : b.ci95[0] > 50 ? "ok" : b.ci95[1] < 50 ? "bad" : "mid");
const rbar = (b) => `<div class="rbar ${rateCls(b)}"><i style="width:${Math.max(0, Math.min(100, (b && b.rate) || 0))}%"></i><span class="mid"></span></div>`;
function scoreNavLine() {
  const S = R.scorecard;
  if (!S || !S.history) return "עוד לא חושב";
  const L = S.live;
  return `${pct1(S.history.overall.rate)} בעבר · ` + (L && L.overall ? `${pct1(L.overall.rate)} במעקב חי` : `מעקב חי: ${L ? L.pending : 0} ממתינות`);
}
function itemScore(i) {
  const S = R.scorecard;
  if (!S) return "";
  const c = (S.current || []).find((x) => x.category === i.category && x.stance === i.stance);
  if (!c || !c.history || !c.history.n) return "";
  const h = c.history;
  return `<div class="hist" data-x="t:hit_rate"><span class="muted x">צדקה בעבר:</span><b class="num">${pct1(h.rate)}</b><span class="muted">מהחודשים ב-${esc(S.regime)}</span><span class="meta">(<span class="num">${h.hits}/${h.n}</span> · לפי <span class="num">${esc(c.ticker)}</span>)</span></div>`;
}
function srow(label, sub, b) {
  return `<div class="srow"><div class="lbl"><span>${label}</span>${sub ? `<span class="meta">${sub}</span>` : ""}</div>${rbar(b)}
    <div class="n"><b class="num">${pct1(b && b.rate)}</b><small class="num">${b ? `${b.hits}/${b.n}` : ""}</small></div></div>`;
}
function score() {
  const S = R.scorecard;
  if (!S || !S.history) return header("סיכויי הצלחה") + `<div class="panel"><p class="muted">אין עדיין נתוני הצלחה בדוח הזה.</p></div>`;
  const H = S.history, o = H.overall, L = S.live || {}, ls = H.long_short || {};
  const verdict = o.ci95[0] > 50
    ? "יתרון קטן אבל עקבי: המסגרת צודקת קצת יותר מחצי מהזמן. על פני הרבה החלטות זה מצטבר, אבל כל המלצה בודדת יכולה לטעות."
    : o.ci95[1] < 50 ? "ההמלצות צדקו פחות מהטלת מטבע. צריך לבדוק את המטריצה." : "עדיין אי אפשר לקבוע שיש יתרון: התוצאה בטווח של מקריות.";
  const hero = `<div class="panel"><div class="row between"><h2><span class="x" data-x="t:hit_rate">אחוז הצלחה היסטורי</span></h2><span class="meta num">${ym(H.window[0])}–${ym(H.window[1])}</span></div>
    <div class="score-big num ${rateCls(o)}">${pct1(o.rate)}</div>
    <p>מתוך <b class="num">${o.n.toLocaleString("en-US")}</b> המלצות חודשיות, <b class="num">${o.hits.toLocaleString("en-US")}</b> צדקו. הטלת מטבע = <span class="num">50%</span> (הקו באמצע).</p>
    <div style="margin:10px 0 4px">${rbar(o)}</div>
    <div class="facts">
      <div class="fact" data-x="t:ci95">${icon("gauge", "sm")}<span class="x">טווח ביטחון: <span class="num">${pct1(o.ci95[0])}–${pct1(o.ci95[1])}</span></span></div>
      <div class="fact" data-x="t:edge">${icon("up", "sm")}<span class="x">יתרון ממוצע: <span class="num">${o.edge > 0 ? "+" : ""}${o.edge.toFixed(2)}%</span> לחודש מול S&amp;P 500</span></div>
      ${ls.periods ? `<div class="fact" data-x="t:long_short">${icon("layers", "sm")}<span class="x">תיק "להגדיל מול להקטין": <span class="num">${ls.mean > 0 ? "+" : ""}${ls.mean.toFixed(2)}%</span> בחודש ממוצע, חיובי ב-<span class="num">${pct1(ls.positive)}</span> מהחודשים</span></div>` : ""}
      ${H.permutation_p !== null && H.permutation_p !== undefined ? `<div class="fact" data-x="t:permutation">${icon("flask", "sm")}<span class="x">בדיקת מקריות: ניחוש אקראי עשה כמו המערכת רק ב-<span class="num">${(H.permutation_p * 100).toFixed(1)}%</span> מהניסיונות</span></div>` : ""}
    </div>
    <div class="todo" style="margin-top:12px"><b>בשורה התחתונה:</b> ${verdict}</div></div>`;

  let live;
  if (L.overall) {
    live = `<div class="score-big num ${rateCls(L.overall)}">${pct1(L.overall.rate)}</div>
      <p><b class="num">${L.overall.hits}</b> מתוך <b class="num">${L.overall.n}</b> המלצות שכבר קיבלו ציון צדקו · עוד <span class="num">${L.pending}</span> ממתינות.</p>
      <div style="margin:10px 0">${rbar(L.overall)}</div>
      ${(L.recent || []).map((r) => `<div class="srow"><div class="lbl"><span>${esc(r.label)}</span><span class="meta"><span class="num">${dmy(r.date)}</span> · ${STANCE[r.stance]} · <span class="num">${esc(r.ticker)}</span></span></div>
        <div class="n"><b class="num">${r.excess > 0 ? "+" : ""}${r.excess.toFixed(2)}%</b><small>מול S&amp;P</small></div>
        <span class="verdict ${r.hit ? "ok" : "bad"}">${icon(r.hit ? "check" : "x", "sm")}${r.hit ? "צדקה" : "טעתה"}</span></div>`).join("")}`;
  } else {
    const due = L.next_due ? new Date(new Date(L.next_due).getTime() + 31 * 864e5).toISOString().slice(0, 10) : null;
    live = `<p>המעקב התחיל ב-<b class="num">${dmy(L.since) || "היום"}</b>. כל יום מסחר נרשמות ההמלצות של היום, וכל אחת מקבלת ציון אחרי <span class="num">21</span> ימי מסחר.</p>
      <div class="duo"><div><div class="meta">ממתינות לציון</div><div class="v num">${L.pending || 0}</div></div>
        <div><div class="meta">הציונים הראשונים, בערך</div><div class="v num">${due ? dmy(due) : "—"}</div></div></div>`;
  }
  const livePanel = `<div class="panel"><h2><span class="x" data-x="t:live_track">מעקב חי</span></h2>${live}</div>`;

  const cur = (S.current || []).filter((c) => c.history && c.history.n).sort((a, b) => b.history.rate - a.history.rate);
  const curPanel = cur.length ? `<div class="panel"><h2>ההמלצות של היום: כמה צדקו בעבר</h2>
    <p class="meta" style="margin:-4px 0 6px">כל המלצה פעילה, ואחוז החודשים שבהם היא צדקה כשהכלכלה הייתה ב-${esc(S.regime)}.</p>
    ${cur.map((c) => srow(esc(c.label), `${STANCE[c.stance]} · <span class="num">${esc(c.ticker)}</span>`, c.history)).join("")}</div>` : "";

    ${sides.up ? srow("להגדיל", "התחום עשה יותר מהמדד", sides.up) : ""}${sides.down ? srow("להקטין", "התחום עשה פחות מהמדד", sides.down) : ""}</div>`;
  const regPanel = `<div class="panel"><h2><span class="x" data-x="t:regime">לפי מצב הכלכלה</span></h2>
    ${Object.entries(H.by_regime || {}).map(([k, b]) => srow(`<span class="badge ${esc(k)}" data-x="t:${esc(k)}">${esc(k)}</span>`, `<span class="num">${(H.regime_months || {})[k] || 0}</span> חודשים`, b)).join("")}</div>`;
  const catPanel = `<div class="panel"><h2>לפי תחום</h2><p class="meta" style="margin:-4px 0 6px">כל המצבים יחד · לפי תעודת סל מייצגת</p>
    ${(H.by_category || []).map((c) => srow(esc(c.label), "", c)).join("")}</div>`;
  const hv = H.halves || {};
  const halves = hv.first ? `<div class="panel"><h2>יציבות לאורך זמן</h2>
    ${srow(`<span class="num">${ym(hv.first.from)}–${ym(hv.first.to)}</span>`, "חצי ראשון", hv.first)}${srow(`<span class="num">${ym(hv.second.from)}–${ym(hv.second.to)}</span>`, "חצי שני", hv.second)}</div>` : "";
  return header("סיכויי הצלחה") + hero + livePanel + curPanel + sidePanel + regPanel + catPanel + halves +
    `<div class="panel"><h2>איך מודדים</h2><p>${esc(H.method_he)}</p>
      <p class="meta" style="margin-top:8px">ירוק = כל טווח הביטחון מעל <span class="num">50%</span> · כתום = בטווח המקריות · אדום = מתחת. מחירים: Yahoo (ספק מסחרי). ההתאמות הפעילות (חוקי אם-אז) לא נכללות במדידה.</p></div>
     <p class="foot">ביצועי עבר אינם מבטיחים תוצאות בעתיד. פלט של מסגרת ניתוח, לא ייעוץ השקעות.</p>`;
}

/* ---------- v5 expert engine (shadow) ---------- */
const GRADE_HE = { m: "מ", s: "ש", x: "ס", a: "ע", d: "ד", b: "ב" };
const OV_STATE = { on: ["דלוקה", "bad"], decay: ["דועכת", "warn"], watch: ["במעקב", "warn"], off: ["כבויה", "mute"] };
const TIER_HE = { full: "פעולה מלאה", half: "חצי גודל", abstain: "הימנעות" };
const DIR_HE = { up: "עולה", down: "יורד", flat: "יציב", unknown: "לא ידוע" };
function v5NavLine() {
  const V = R.v5;
  if (!V) return "עוד לא חושב";
  if (V.error) return "לא חושב בריצה הזו";
  return `${V.regime.code || "—"} · ${V.regime.sub_state || ""} · ביטחון ${V.confidence.total ?? "—"}`;
}
function zbar(v) {
  if (v === null || v === undefined) return `<div class="zbar"><span class="mid"></span></div>`;
  const w = Math.min(50, Math.abs(v) / 3 * 50);
  return `<div class="zbar"><i class="${v > 0 ? "pos" : "neg"}" style="left:${v > 0 ? 50 : 50 - w}%;width:${w}%"></i><span class="mid"></span></div>`;
}
const spill = (v) => { const c = v >= 2 ? "p2" : v >= 1 ? "p1" : v <= -2 ? "n2" : v <= -1 ? "n1" : "z0";
  return `<span class="score-pill num ${c}">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}</span>`; };
function v5Pillar(code) {
  const p = R.v5.pillars.find((x) => x.code === code);
  if (!p) return;
  openSheet(`<h2 id="sheet-title">${esc(p.label)} <span class="meta num">(${esc(p.code)})</span></h2>
    <div class="meta">רמה <b class="num">${p.level ?? "—"}</b> · כיוון ${DIR_HE[p.dir]} (<span class="num">${p.direction ?? "—"}</span>) · כיסוי <span class="num">${Math.round(p.coverage * 100)}%</span></div>
    <p class="why" data-x="t:pillar">ערך חיובי = חם יותר, הדוק יותר או מתוח יותר מהרגיל ב-10 השנים האחרונות. לחיצה כאן מסבירה מה זה עמוד תווך.</p>
    ${p.inputs.map((i) => `<div class="srow"><div class="lbl"><span>${esc(i.label)}</span><span class="meta"><span class="num">${i.value ?? "—"}</span>${i.date ? ` · ${esc(i.date)}` : " · אין נתון"}</span></div>${zbar(i.z)}<div class="n"><b class="num">${i.z ?? "—"}</b><small>z</small></div></div>`).join("")}`);
}
function v5() {
  const V = R.v5;
  if (!V || V.error) return header("מנוע מומחה v5") + `<div class="panel"><p class="muted">${V && V.error ? "המנוע לא חושב בריצה הזו: " + esc(V.error) : "המנוע עוד לא רץ בדוח הזה."}</p></div>`;
  const g = V.regime, c = V.confidence, live = R.regime ? R.regime.code : null, B = V.backtest;
  const same = live && g.code === live;
  const intro = `<div class="panel"><div class="row between"><h2><span class="x" data-x="t:v5">מה זה</span></h2><span class="shadow-badge">${icon("flask", "sm")}בבדיקה · לא משנה המלצות</span></div>
    <p style="margin-top:6px">מנוע לפי המפרט החדש, שרץ במקביל למנוע הקיים. ההמלצות בפועל (מסך ההקצאה וטלגרם) נשארות של המנוע הקיים, עד ששכבה מוכיחה את עצמה בבדיקה ההיסטורית.</p>
    <p class="meta" style="margin-top:6px">נכון לשבוע של <span class="num">${esc(V.as_of)}</span> · גרסה <bdi dir="ltr">${esc(V.version)}</bdi></p></div>`;

  const bandTxt = (v, b, unit) => `<span class="num">${v ?? "—"}${unit}</span> <span class="meta">(רצועה <span class="num">${b.down}–${b.up}${unit}</span>)</span>`;
  const reg = `<div class="panel"><div class="regime-head"><span class="badge ${esc(g.code || "")}" data-x="t:${esc(g.code || "regime")}">${esc(g.code || "—")}</span><h2>${esc(g.sub_state || "")}</h2></div>
    <div class="facts" style="margin-top:8px">
      <div class="fact" data-x="t:band">${icon("gauge", "sm")}<span class="x">אינפלציית ליבה, ממוצע 3 חודשים: ${bandTxt(g.infl, g.infl_band, "%")}${g.infl_in_band ? " · <b>בתוך הרצועה</b>" : ""}</span></div>
      <div class="fact" data-x="t:output_gap">${icon("gauge", "sm")}<span class="x">פער: אבטלה טבעית פחות אבטלה: ${bandTxt(g.gap, g.gap_band, "")}${g.gap_in_band ? " · <b>בתוך הרצועה</b>" : ""}</span></div>
      <div class="fact">${icon("repeat", "sm")}<span>במצב הזה <span class="num">${g.weeks_since_flip}</span> שבועות${g.last_flip ? ` (מאז <span class="num">${esc(g.last_flip)}</span>)` : ""} · צמיחה ועבודה: ${DIR_HE[g.gl_dir]}</span></div>
      ${g.override ? `<div class="fact">${icon("alert", "sm")}<span><b>עקיפה פעילה:</b> כלל סאם או התביעות העבירו מיד לצד של פער שלילי</span></div>` : ""}
      ${g.r4_cooling ? `<div class="fact">${icon("alert", "sm")}<span><b>אזהרת R4 מתקרר</b></span></div>` : ""}
      <div class="fact">${icon(same ? "check" : "info", "sm")}<span>המנוע הקיים: <b>${esc(live || "—")}</b>${same ? " · מסכימים" : " · <b>לא מסכימים</b>"}</span></div>
    </div></div>`;

  const W = c.weights || {};
  const CN = { boundary: "מרחק מהגבול", pillar_agreement: "הסכמת עמודי התווך", persistence: "התמדה", market_confirmation: "אישור השוק", freshness: "עדכניות הנתונים" };
  const conf = `<div class="panel"><div class="row between"><h2><span class="x" data-x="t:confidence">ציון ביטחון</span></h2><span class="pill ${c.tier === "full" ? "ok" : c.tier === "half" ? "warn" : "bad"}">${TIER_HE[c.tier] || ""}</span></div>
    <div class="score-big num ${c.tier === "full" ? "ok" : c.tier === "abstain" ? "bad" : ""}">${c.total ?? "—"}</div>
    ${Object.keys(W).map((k) => { const f = c.components[k] ?? 0;
      return `<div class="srow"><div class="lbl"><span>${CN[k] || k}</span></div><div class="rbar ${f >= 0.65 ? "ok" : f >= 0.45 ? "mid" : "bad"}"><i style="width:${Math.round(f * 100)}%"></i></div><div class="n"><b class="num">${Math.round(f * W[k])}</b><small class="num">מתוך ${W[k]}</small></div></div>`; }).join("")}
    <p class="meta" style="margin-top:8px"><span class="num">65</span> ומעלה = פעולה מלאה · <span class="num">45–65</span> = חצי גודל · מתחת ל-<span class="num">45</span> = הימנעות</p></div>`;

  const pills = `<div class="panel"><h2><span class="x" data-x="t:pillar">שמונה עמודי התווך</span></h2><p class="meta" style="margin:-4px 0 6px">ימינה מהקו = חם, הדוק או מתוח מהרגיל · לחיצה על עמוד מציגה את הנתונים שלו</p>
    ${V.pillars.map((p) => `<div class="srow" data-v5p="${esc(p.code)}" role="button" tabindex="0"><div class="lbl"><span class="x">${esc(p.label)}</span><span class="meta">${DIR_HE[p.dir]}${p.coverage < 1 ? ` · כיסוי <span class="num">${Math.round(p.coverage * 100)}%</span>` : ""}</span></div>${zbar(p.level)}<div class="n"><b class="num">${p.level ?? "—"}</b><small>z</small></div></div>`).join("")}</div>`;

  const ovl = `<div class="panel"><h2><span class="x" data-x="t:overlay">שכבות סיכון</span></h2>
    ${V.overlays.map((o) => { const [he, cls] = OV_STATE[o.state] || OV_STATE.off;
      const eff = Object.entries(o.effects || {}).map(([k, v]) => { const row = V.sectors.find((x) => x.id === k); return `${v > 0 ? "+" : "−"}${row ? row.label : k}`; }).join(", ");
      return `<div class="vrow"><div><b>${esc(o.code)}</b> ${esc(o.label)}<span class="meta">ציון <span class="num">${o.score ?? "—"}</span>${eff ? ` · משפיעה על: ${esc(eff)}` : ""}${o.on_share !== null ? ` · דלוקה <span class="num">${Math.round(o.on_share * 100)}%</span> מהזמן` : ""}</span></div><span class="st ${cls}">${he}</span></div>`; }).join("")}
    <p class="meta" style="margin-top:8px">אנרגיה נקבעת לפי O3 ולא לפי מצב הכלכלה (המחקר: אנרגיה לא מגיבה למחזור הכלכלי בארה״ב).</p></div>`;

  const secs = [...V.sectors].sort((a, b) => b.score - a.score);
  const sec = `<div class="panel"><h2>מטריצת הסקטורים</h2><p class="meta" style="margin:-4px 0 6px">ציון מ-<span class="num">2−</span> עד <span class="num">2+</span> · <span class="x" data-x="t:evidence">דרגת ראיות</span> · <span class="x" data-x="t:price_gate">תנאי מחיר</span></p>
    ${secs.map((x) => `<div class="vrow"><div><span>${esc(x.label)}</span> <span class="tk" data-chart="${esc(x.etf)}" data-label="${esc(x.label)}">${esc(x.etf)}</span>
      <span class="meta">${esc(x.action_he)}${x.overlay_push ? ` · שכבות: <span class="num">${x.overlay_push > 0 ? "+" : ""}${x.overlay_push}</span>` : ""}${x.note ? ` · ${esc(x.note)}` : ""}${x.structural ? " · מבני" : ""}</span></div>
      <div class="row" style="gap:6px"><span class="grade" data-x="t:evidence">${GRADE_HE[x.grade] || ""}</span>${spill(x.score)}</div></div>`).join("")}</div>`;

  let bt = "";
  if (B && B.variants) {
    const keys = Object.keys(B.variants);
    const best = keys.reduce((a, k) => ((B.variants[k].basket_63d.holdout.rate ?? 0) > (B.variants[a].basket_63d.holdout.rate ?? 0) ? k : a), keys[0]);
    const cell = (b) => `<td class="num">${b.rate === null ? "—" : pct1(b.rate)}<br><small class="meta num">${b.n}</small></td>`;
    const ov = B.overlays || {};
    bt = `<div class="panel"><h2><span class="x" data-x="t:ablation">הבדיקה ההיסטורית, שכבה אחרי שכבה</span></h2>
      <p class="meta" style="margin:-4px 0 8px"><span class="num">${ym(B.window[0])}–${ym(B.window[1])}</span> · נתונים כפי שפורסמו באותו יום · "לא נראה" = <span class="num">2019</span> והלאה, נפתח פעם אחת</p>
      <table class="vt"><tr><th>גרסה</th><th class="num">שורות 20 יום</th><th class="num">סל 63 יום</th><th class="num">סל 63, לא נראה</th></tr>
      ${keys.map((k) => { const v = B.variants[k]; return `<tr class="${k === best ? "best" : ""}"><td>${esc(v.label_he)}</td>${cell(v.rows_20d.all)}${cell(v.basket_63d.all)}${cell(v.basket_63d.holdout)}</tr>`; }).join("")}</table>
      <div class="todo" style="margin-top:12px"><b>מה יצא:</b> ${(() => {
        const A = B.variants.A_plain, last = B.variants[keys[keys.length - 1]];
        const a63 = A.basket_63d.all.rate ?? 0, h63 = A.basket_63d.holdout.rate ?? 0;
        const better = keys.slice(1).filter((k) => (B.variants[k].basket_63d.holdout.rate ?? 0) > h63);
        const base = a63 >= 58 && h63 >= 55
          ? `המטריצה החדשה עצמה עובדת: הסל שהיא ממליצה להגדיל עקף את הסל שהיא ממליצה להקטין ב-<b class="num">${pct1(a63)}</b> מהמקרים ב-63 יום, וגם בתקופה שלא נראתה (<span class="num">${pct1(h63)}</span>). יעד המפרט: <span class="num">58%–60%</span>.`
          : `המטריצה החדשה לבדה: <b class="num">${pct1(a63)}</b> ב-63 יום, <span class="num">${pct1(h63)}</span> בתקופה שלא נראתה. עוד לא ביעד המפרט (<span class="num">58%–60%</span>).`;
        const layers = better.length
          ? ` שכבות ששיפרו בתקופה שלא נראתה: ${better.map((k) => esc(B.variants[k].label_he)).join(", ")}.`
          : " השכבות הנוספות, כפי שהן כתובות במפרט, <b>לא שיפרו</b> בתקופה שלא נראתה, ולכן הן נשארות בבדיקה.";
        return base + layers; })()}</div>
      <h3 style="margin-top:14px">בדיקות שפיות</h3>
      ${Object.entries(ov).map(([k, o]) => { const ok = o.on_share >= o.target[0] && o.on_share <= o.target[1];
        return `<div class="vrow"><div>${esc(k)}: דלוקה <span class="num">${Math.round(o.on_share * 100)}%</span> מהזמן<span class="meta">יעד <span class="num">${o.target[0] * 100}%–${o.target[1] * 100}%</span>${o.on_share > 0.4 ? " · מעל 40%: זה מצב קבוע ולא חריגה" : ""}</span></div><span class="verdict ${ok ? "ok" : "bad"}">${icon(ok ? "check" : "x", "sm")}${ok ? "תקין" : "לא בטווח"}</span></div>`; }).join("")}
      ${B.regime ? `<div class="vrow"><div>מעברי משטר: <span class="num">${B.regime.flips}</span><span class="meta">התהפכו תוך פחות מ-3 חודשים: <span class="num">${B.regime.flips_reversed_within_3m}</span></span></div><span class="verdict ${B.regime.flips_reversed_within_3m === 0 ? "ok" : "bad"}">${icon(B.regime.flips_reversed_within_3m === 0 ? "check" : "x", "sm")}${B.regime.flips_reversed_within_3m === 0 ? "יציב" : "קפיצות"}</span></div>` : ""}
      ${B.confidence_tiers_20d ? `<div class="vrow"><div>ביטחון מלא מול חצי<span class="meta">אחוז הצלחה של שורות: <span class="num">${pct1(B.confidence_tiers_20d.full.rate)}</span> מול <span class="num">${pct1(B.confidence_tiers_20d.half.rate)}</span> · הימנעות לא הופעלה אף פעם</span></div><span class="verdict ${(B.confidence_tiers_20d.full.rate ?? 0) > (B.confidence_tiers_20d.half.rate ?? 0) ? "ok" : "bad"}">${icon("dot", "sm")}חלש</span></div>` : ""}
      ${(B.not_done_he || []).length ? `<p class="meta" style="margin-top:10px">עוד לא נבדק: ${B.not_done_he.map(esc).join(" · ")}</p>` : ""}
      <p class="meta" style="margin-top:6px">${esc(B.method_he || "")}</p></div>`;
  }
  return header("מנוע מומחה v5") + intro + reg + conf + pills + ovl + sec + bt +
    `<p class="foot">מנוע בבדיקה. פלט של מסגרת ניתוח, לא ייעוץ השקעות.</p>`;
}

function exec() {
  const e = R.execution;
  const actions = e.actions.length ? `<ol class="list">${e.actions.map((a) => `<li>${html(a)}</li>`).join("")}</ol>`
    : `<p>אין התראות. לפעול לפי ההקצאה הבסיסית של הרג'ים.</p>`;
  const screen = String(html(e.screening_he)).split(/\s\|\s/).map((x) => `<div class="note">${icon("check", "sm")}<span>${x}</span></div>`).join("");
  return header("ביצוע וסיכון") +
    `<div class="panel"><h2>פעולות</h2>${actions}</div>
     ${e.conclusions.length ? `<div class="panel"><h2>הרקע</h2>${e.conclusions.map((c) => `<p style="margin-bottom:10px">${html(c)}</p>`).join("")}</div>` : ""}
     <div class="panel"><h2>סגנון השקעה</h2><p>${html(e.factors_he)}</p></div>
     <div class="panel"><h2>סינון מניות</h2>${screen}
       <p class="meta" style="margin-top:10px">רשימת בדיקה לפי הרג'ים. המערכת עדיין לא מסננת מניות בפועל.</p></div>
     <p class="foot">פלט של מסגרת ניתוח ולא ייעוץ השקעות אישי.</p>`;
}

function news() {
  const n = R.news;
  return header("כותרות") + (n.items.length
    ? `<div class="panel"><p class="meta" style="margin-bottom:10px">מקור: ${esc(n.source)}</p>${n.items.map((h) => `<div class="note" dir="ltr" style="text-align:left">${icon("news", "sm")}<span>${esc(h)}</span></div>`).join("")}</div>`
    : `<div class="panel"><div class="row" style="align-items:flex-start"><span class="sev state">${icon("news")}</span><div><b>אין כותרות מה-36 השעות האחרונות</b><p class="meta" style="margin-top:2px">הדוח בענן לא כולל כותרות. הן נוספות כשמרעננים אותן משכבת Claude.</p></div></div></div>`);
}

const STATUS = {

const STATUS_ORDER = ["official", "validated", "commercial", "unverified", "estimate", "failed", "missing"];

  backup_active:      ["גיבוי פעיל", "warn", "repeat"],
  diverged:           ["סטייה בין מקורות", "bad", "alert"],
  all_failed:         ["כל המקורות נכשלו", "bad", "x"],
  backup_unavailable: ["הגיבוי לא זמין", "warn", "dot"],
  not_checked:        ["לא הוצלב בהרצה זו", "mute", "dot"],
};
function ageHe(d) {
  if (d === null || d === undefined) return "";
  return d === 0 ? "היום" : d === 1 ? "אתמול" : `לפני ${d} ימים`;
}
function data() {
  const q = R.data_quality;
  const all = Object.entries(R.signals);
  const counts = STATUS_ORDER.map((st) => [st, all.filter(([, s]) => s.status === st).length]).filter(([, n]) => n);
  const summary = counts.map(([st, n]) => `<span class="st ${STATUS[st][1]}">${icon(STATUS[st][2], "sm")}${STATUS[st][0]} <b class="num">${n}</b></span>`).join("");
  const order = (R.data_groups && R.data_groups.length) ? R.data_groups : [...new Set(all.map(([, s]) => s.group))];
  const groups = order.map((g) => {
    const rows = all.filter(([, s]) => s.group === g).sort((a, b) => a[1].label.localeCompare(b[1].label, "he"));
    if (!rows.length) return "";
    return `<div class="panel"><h2>${esc(g)} <span class="meta">${rows.length}</span></h2>${rows.map(([k, s]) => {
      const [stHe, cls, ic] = STATUS[s.status] || STATUS.unverified;
      const val = s.status === "missing" ? `<span class="muted">—</span>` : num(s.value, "", s.signed);
      const detail = s.status === "missing" ? `<span class="src bad-txt">${esc(s.reason)}</span>` :
        `<span class="src">${esc(s.publisher || s.source)}${s.date ? ` · <span class="num">${esc(s.date)}</span> (${ageHe(s.age_days)})` : ""} · <span class="tk">${esc(s.id)}</span></span>`;
      return `<div class="drow" data-x="sig:${esc(k)}"><div class="grow"><div class="x">${esc(s.label)}</div>${detail}</div>
        <div class="dval"><div class="v" data-sig="${esc(k)}">${val}</div><span class="st ${cls}" data-x="t:${["official","validated","commercial","estimate"].includes(s.status) ? s.status : "unverified"}">${icon(ic, "sm")}${stHe}</span>${
          RED[(s.redundancy || {}).status] ? `<span class="st ${RED[s.redundancy.status][1]}" data-x="t:redundancy">${icon(RED[s.redundancy.status][2], "sm")}${RED[s.redundancy.status][0]}</span>` : ""}</div></div>`;
    }).join("")}</div>`;
  }).join("");
  const red = q.redundancy || [];
  const redOk = red.filter((e) => e.status === "consensus").length;
  const redRows = red.map((e) => {
    const [he, cls, ic] = RED[e.status] || ["", "mute", "dot"];
    const srcs = e.sources.map((x) => `<span class="tk">${esc(x.split(":")[0].toUpperCase())}</span>`).join(" ↔ ");
    return `<div class="drow"><div class="grow"><div>${esc(e.label)} <span class="meta">${srcs}</span></div><span class="src">${esc(e.detail)}</span></div>
      <div class="dval"><span class="st ${cls}">${icon(ic, "sm")}${he}</span>${e.used ? `<span class="meta">בשימוש: ${esc(e.used.split(":")[0].toUpperCase())}</span>` : ""}</div></div>`;
  }).join("");
  const val = q.validation.map((v) => `<div class="alert-row"><span class="sev ${v.ok ? "info" : "critical"}">${icon(v.ok ? "check" : "x")}</span>
      <div class="grow"><b>${esc(v.label)}</b><span class="src">${esc(v.detail)}</span></div></div>`).join("");
  const missing = (R.missing_data || []).map((m) => `<div class="drow"><div class="grow"><div>${esc(m.label_he)}</div><span class="src">${esc(m.reason_he)}</span></div>
      <div class="dval"><div class="meta">בקובץ: ${esc(m.spec)}</div><span class="st bad">${icon("x", "sm")}חסר מקור</span></div></div>`).join("");
  return header("איכות ומקורות") +
    `<div class="panel"><h2>${all.length} נתונים במערכת</h2><div class="chips" style="margin-top:4px">${summary}</div>
       <p class="meta" style="margin-top:10px">מקור רשמי: הגוף שמפרסם את הנתון (BLS, BEA, הפד, משרד האוצר). אומת: מחיר בזמן אמת שהושווה למקור הרשמי בהרצה הזו. לא אומת: אין מקור רשמי חינמי להשוואה. תאריך = תאריך התצפית האחרונה.</p></div>
     ${red.length ? `<div class="panel"><h2><span class="x" data-x="t:redundancy">גיבוי והצלבה בין מקורות</span> <span class="meta">${redOk}/${red.length} תואמים</span></h2>
       <p class="meta" style="margin:-6px 0 6px">כל נתון כאן נמשך משני מפרסמים ומושווה על אותה תצפית. סטייה פוסלת את הנתון ושולחת התראה. אם המקור הראשי נופל, הגיבוי נכנס ומסומן.</p>${redRows}</div>` : ""}
     <div class="panel"><h2>אימות מחירי שוק מול מקור רשמי</h2>${val}</div>
     ${groups}
     ${missing ? `<div class="panel"><h2>נתונים מהמפרט שאינם במערכת <span class="meta">${(R.missing_data || []).length}</span></h2>
       <p class="meta" style="margin:-6px 0 6px">אין להם מקור מאומת, ולכן הם לא נכנסים לחישוב. שום ערך לא מנוחש.</p>${missing}</div>` : ""}`;
}

/* ---------- boot + auto-refresh ---------- */
function load(first) {
  return fetch("data/report.json?ts=" + Date.now(), { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => {
      if (first) { R = d; render(false); return; }
      if (d.meta.generated_at !== R.meta.generated_at) { PREV = R; R = d; render(true); haptic(); }
      else { const a = $(".ago"); if (a) a.textContent = ago(R.meta.generated_at); }   // only the label
    })
    .catch((e) => {
      if (first) $("#app").innerHTML = `<div class="panel err"><h2>הדוח לא נטען</h2><p class="muted" style="margin-top:6px">בדוק את החיבור ונסה שוב בעוד רגע.</p><p class="meta" style="margin-top:4px">${esc(e.message)}</p></div>`;
    });
}
load(true);
setInterval(() => load(false), 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-go],[data-tab],.back")) { e.preventDefault(); e.target.click(); }
});
</script>
</body>
</html>
